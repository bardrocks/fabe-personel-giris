name: Windows uygulamasını derle

on:
  push:
    paths:
      - 'doviz-hesap/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: doviz-hesap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: FabeDovizHesap-Windows
          path: doviz-hesap/dist/*.exe
